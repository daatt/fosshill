<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Viewport fix prevents zooming and ensures correct scale on mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Foss Hill Labs</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            /* Prevents scroll bounce/refresh behavior on mobile */
            touch-action: none; 
        }

        canvas {
            display: block;
            outline: none;
        }

        #overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%; /* prevent text hitting edges */
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        h1 {
            color: #ffffff;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.8);
            margin: 0;
            
            /* Desktop size */
            font-size: 4vw; 
        }

        /* Mobile Optimization for Text */
        @media (max-width: 768px) {
            h1 {
                /* Make text much larger on portrait screens */
                font-size: 8vw; 
                line-height: 1.1;
            }
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>Foss Hill Labs</h1>
    </div>

    <!-- Import Three.js -->
    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

        // --- Configuration ---
        const CONFIG = {
            colorHigh: new THREE.Color(0x00ffff),
            colorLow: new THREE.Color(0x001133),
            speed: 0.15,
            // 96 is lower than 128, saves battery on mobile but still looks smooth
            gridSize: 96, 
        };

        // --- Scene ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);
        scene.fog = new THREE.FogExp2(0x050505, 0.06);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 2.5, 6.5);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        
        // Critical for mobile performance: max out at 2x pixel density (Retina), ignore 3x
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
        
        document.body.appendChild(renderer.domElement);

        // --- Shaders (Same as before, GPU driven) ---
        const vertexShader = `
            uniform float uTime;
            varying float vElevation;

            vec3 permute(vec3 x) { return mod(((x*34.0)+1.0)*x, 289.0); }
            float snoise(vec2 v){
                const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
                vec2 i  = floor(v + dot(v, C.yy) );
                vec2 x0 = v -   i + dot(i, C.xx);
                vec2 i1;
                i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
                vec4 x12 = x0.xyxy + C.xxzz;
                x12.xy -= i1;
                i = mod(i, 289.0);
                vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 )) + i.x + vec3(0.0, i1.x, 1.0 ));
                vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
                m = m*m ;
                m = m*m ;
                vec3 x = 2.0 * fract(p * C.www) - 1.0;
                vec3 h = abs(x) - 0.5;
                vec3 ox = floor(x + 0.5);
                vec3 a0 = x - ox;
                m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
                vec3 g;
                g.x  = a0.x  * x0.x  + h.x  * x0.y;
                g.yz = a0.yz * x12.xz + h.yz * x12.yw;
                return 130.0 * dot(m, g);
            }

            void main() {
                vec3 pos = position;
                float noiseElevation = snoise(vec2(pos.x * 0.3, pos.z * 0.3 + uTime * 0.5)) * 1.5;
                noiseElevation += snoise(vec2(pos.x * 1.0, pos.z * 1.0 + uTime * 0.5)) * 0.2;
                pos.y += noiseElevation;
                vElevation = noiseElevation; 
                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
        `;

        const fragmentShader = `
            uniform vec3 uColorHigh;
            uniform vec3 uColorLow;
            varying float vElevation;
            void main() {
                float mixStrength = (vElevation + 1.0) / 2.5;
                vec3 color = mix(uColorLow, uColorHigh, mixStrength);
                gl_FragColor = vec4(color, 1.0);
            }
        `;

        // --- Mesh ---
        const geometry = new THREE.PlaneGeometry(22, 22, CONFIG.gridSize, CONFIG.gridSize);
        geometry.rotateX(-Math.PI / 2);

        const material = new THREE.ShaderMaterial({
            vertexShader: vertexShader,
            fragmentShader: fragmentShader,
            uniforms: {
                uTime: { value: 0 },
                uColorHigh: { value: CONFIG.colorHigh },
                uColorLow: { value: CONFIG.colorLow }
            },
            wireframe: true,
            transparent: true
        });

        const terrain = new THREE.Mesh(geometry, material);
        scene.add(terrain);

        // --- Animation ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            material.uniforms.uTime.value = elapsedTime * CONFIG.speed;
            terrain.rotation.y = Math.sin(elapsedTime * 0.05) * 0.05;

            renderer.render(scene, camera);
        }

        // --- Responsive Resize ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        });

        animate();

    </script>
</body>
</html>
